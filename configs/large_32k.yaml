data:
  strategy: 'dfs'
  use_bos_eos: false
  order_mode: 'prefer_targets_first'
  doc_budget: null

model:
  compile: true
  compile_mode: 'default'
  attention_backend: 'triton'  # kernel auto-selected per mask_type; set to 'flex' to compare
  mask_type: 'doc_causal'             # override per run: doc_causal | cross_doc_link
  # link_detector: 'markdown'     # set to 'markdown' or 'python' when mask_type=cross_doc_link
  # max_grants: 256               # cross_doc_link only; 256 covers observed max for all datasets
  model_dim: 1280
  num_layers: 36
  num_heads: 20
  max_seq_len: 32768
  dropout: 0.0
  drop_path_rate: 0.0
  fp8: false
  weight_tying: true
  ignore_index: -100
  dtype: 'bfloat16'
  logit_softcap: 30.0  # tanh softcap: softcap * tanh(logits / softcap)

optimizer:
  type: 'muon'
  muon_wd: 1.2    # Muon weight decay (spectral space — higher than AdamW)
  adamw_wd: 0.005  # AdamW weight decay (embedding, norms)
  momentum: 0.95
  beta1: 0.9
  beta2: 0.95
  muon_lr: 0.003
  adamw_lr: 0.00004
  muon_momentum_warmup_steps: 300  # ramp momentum 0.85→0.95 over first N steps
  adamw_embed_beta1: 0.5           # lower β1 for embedding/lm_head (sparse gradients)

train_loop:
  epochs: 1
  max_optimizer_steps: 16000
  cooldown_frac: 0.4    # decay LR over the final 40% of training
  min_lr_ratio: 0.1     # LR at end = base_lr * min_lr_ratio
  val_steps: 20
  val_interval: 100
  atomic_feature_kwargs: {}

seed: 42
