data:
  strategy: 'random'
  layout_policy: 'bos_eos'  # null | bos_eos | identifier_prefix | identifier_prefix_bos_eos
  order_mode: 'prefer_targets_first'
  doc_budget: null

model:
  compile: true
  compile_mode: 'default'
  attention_backend: 'triton'
  mask_type: 'doc_causal'
  model_dim: 1024
  num_layers: 24
  num_heads: 8   # 8H × 128D = 1024 head_dim=128
  max_seq_len: 32768
  drop_path_rate: 0.0
  fp8: false
  weight_tying: true
  ignore_index: -100
  dtype: 'bfloat16'
  logit_softcap: 30.0  # tanh softcap: softcap * tanh(logits / softcap)

optimizer:
  type: 'muon'
  muon_wd: 1.2    # Muon weight decay (spectral space — higher than AdamW)
  adamw_wd: 0.005  # AdamW weight decay (embedding, norms)
  momentum: 0.95
  beta1: 0.9
  beta2: 0.95
  muon_lr: 0.003
  adamw_lr: 0.00004
  muon_momentum_warmup_steps: 300  # ramp momentum 0.85→0.95 over first N steps
  adamw_embed_beta1: 0.5           # lower β1 for embedding/lm_head (sparse gradients)

train_loop:
  epochs: 1
  max_optimizer_steps: 18400  # ~1 pass: 3.56M nodes / (12.1 random docs/pack × 8 GPUs × 2 accum) = 18,400 steps/pass
  cooldown_frac: 0.4    # decay LR over the final 40% of training
  min_lr_ratio: 0.1     # LR at end = base_lr * min_lr_ratio
  val_steps: 30
  val_interval: 300           # every N optimizer steps (~every 1.6% of training)
  atomic_feature_kwargs:
    # accum_steps: only the last micro-batch per optimizer step runs DDP sync
    # (all-reduce); the rest are no_sync (pure compute, no NCCL barrier).
    # Perf context: backward time varies 2–6s across ranks depending on mask
    # density (dense cross_doc packs → slow FlexAttention backward → slow ranks
    # stall fast ranks at the NCCL barrier). accum_steps=2 halves stall frequency.
    # Token budget: N_GPUs × seq_len × accum_steps = effective tokens/optimizer step.
    # 16 GPUs × 32k × 1 = 524k tok/step (current running job, accum_steps=1)
    # 16 GPUs × 32k × 2 = 1M tok/step (this baseline, accum_steps=2)
    accum_steps: 2

seed: 42
