data:
  dataset_dir: /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/fineweb
  strategy: 'bfs'
  layout_policy: 'stochastic_identifier_prefix'
  inference_layout_policy: 'eos'
  order_mode: 'prefer_targets_first'
  doc_budget: null
  train_dir:   /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/fineweb/splits/train
  epoch_dirs:  /fss-data/evin_t/tagseq2tagseq_artifacts/schedules/fineweb_bfs/epoch_0
  # FineWeb is edgeless (flat web text): there are NO links, so community-based
  # splits come out empty. Only the *_random splits are meaningful.
  val_dirs:
    val_random:    /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/fineweb/splits/val_random
  test_dirs:
    test_random:   /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/fineweb/splits/test_random

model:
  compile: true
  compile_mode: 'default'
  attention_backend: 'triton'
  inference_attention_backend: 'flex'
  mask_type: 'doc_causal'
  # No link_detector needed: doc_causal training never resolves links (main.py
  # only builds a detector for cross_doc_link / doc_concat_link). The precompute
  # step uses --link-detector null (edgeless) so no spurious grants fire.
  activation_checkpointing: false
  model_dim: 1024
  num_layers: 24
  num_heads: 8    # 8H × 128Dh = 1024
  max_seq_len: 32768
  drop_path_rate: 0.0
  fp8: false
  weight_tying: true
  untie_at_frac: 0.667       # release embed/lm_head tie at 2/3 of training
  ignore_index: -100
  dtype: 'bfloat16'
  logit_softcap: 30.0
  mtp_extra_weights: [0.5, 0.25]
  mtp_decay_steps: 0
  ve_layers: [1, 2, 21, 22, 23]
  shared_ve_bank: false

optimizer:
  type: 'muon'
  muon_wd: 1.2             # Muon weight decay (spectral space)
  adamw_wd: 0.005          # AdamW weight decay (embeddings, norms)
  momentum: 0.95
  muon_beta2: 0.95         # NorMuon second-moment EMA
  beta1: 0.9
  beta2: 0.95
  muon_lr: 0.001
  adamw_lr: 0.00001
  muon_momentum_warmup_steps: 300
  adamw_embed_beta1: 0.5   # lower β1 for embedding/lm_head (sparse gradients)

train_loop:
  epochs: 1
  max_optimizer_steps: null  # determined by epoch precomputation
  warmup_steps: 300
  cooldown_frac: 0.4
  min_lr_ratio: 0.1
  val_steps: 20
  val_interval: 250
  # Overwrite a single latest.pt every N optimizer steps (independent of val)
  # so a kill/preemption loses at most N steps. Set to val_interval here.
  # latest.pt embeds full optimizer state (>model size) — written to /fss-data
  # each time; resume with --resume-from <run>/checkpoints/latest.pt (or best_model.pt).
  save_latest_interval: 250
  atomic_feature_kwargs:
    norm_clip_value: 1.0
    accum_steps: 1

seed: 42

eval:
  run_on_completion: true
  # FineWeb has no link graph, so community_pack_perplexity and the
  # Wikipedia-specific graph benchmarks (wiki_qa, hotpotqa) don't apply. Keep
  # held-out perplexity (the flat baseline number) plus generic LLM benchmarks.
  benchmarks:
    - {name: held_out_perplexity, conditions: [doceval]}
    - {name: hellaswag,   conditions: [doceval]}
    - {name: boolq,       conditions: [doceval]}
    - {name: openbookqa,  conditions: [doceval]}
  max_docs: 500

