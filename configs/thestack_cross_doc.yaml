data:
  dataset_dir: /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/thestack
  strategy: 'bfs'
  layout_policy: 'stochastic_identifier_prefix'
  inference_layout_policy: 'identifier_prefix_eos'
  order_mode: 'prefer_targets_first'
  doc_budget: null
  train_dir:   /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/thestack/splits/train
  epoch_dirs:  /fss-data/evin_t/tagseq2tagseq_artifacts/schedules/thestack_bfs/epoch_0
  val_dirs:
    val_community: /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/thestack/splits/val_community
    val_random:    /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/thestack/splits/val_random
  test_dirs:
    test_community: /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/thestack/splits/test_community
    test_random:    /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/thestack/splits/test_random

model:
  compile: true
  compile_mode: 'default'
  attention_backend: 'triton'
  inference_attention_backend: 'flex'
  mask_type: 'cross_doc_link'
  link_detector: 'python'
  max_grants: 256
  # max_grants_start: 64
  # max_grants_warmup_steps: 5000
  activation_checkpointing: false
  model_dim: 1024
  num_layers: 24
  num_heads: 8    # 8H × 128Dh = 1024
  max_seq_len: 32768
  drop_path_rate: 0.0
  fp8: false
  weight_tying: true
  untie_at_frac: 0.667
  ignore_index: -100
  dtype: 'bfloat16'
  logit_softcap: 30.0
  mtp_extra_weights: [0.5, 0.25]
  mtp_decay_steps: 0
  ve_layers: [1, 2, 21, 22, 23]
  shared_ve_bank: false
  # use_bigram: false
  # bigram_vocab_size: 251520

optimizer:
  type: 'muon'
  muon_wd: 1.2
  adamw_wd: 0.005
  momentum: 0.95
  muon_beta2: 0.95
  beta1: 0.9
  beta2: 0.95
  muon_lr: 0.001
  adamw_lr: 0.00001
  muon_momentum_warmup_steps: 300
  adamw_embed_beta1: 0.5

train_loop:
  epochs: 1
  max_optimizer_steps: null  # set after epoch precomputation; BucketedPackDataset terminates naturally
  warmup_steps: 300
  cooldown_frac: 0.4
  min_lr_ratio: 0.1
  val_steps: 30
  val_interval: 300
  atomic_feature_kwargs:
    norm_clip_value: 1.0
    accum_steps: 1

seed: 42

eval:
  run_on_completion: true
  benchmarks:
    - {name: held_out_perplexity,       conditions: [baseline, experimental]}
    - {name: community_pack_perplexity, conditions: [baseline, experimental]}
    - {name: repobench,                 conditions: [doceval]}
    - {name: repobench_cross_doc,       conditions: [experimental]}
    - {name: codexglue_code_to_text,    conditions: [doceval]}
    - {name: humaneval_buggy,           conditions: [doceval]}
  max_docs: 500

