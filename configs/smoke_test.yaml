## Smoke-test config: minimal training run to exercise multi_val + end-of-training eval.
## val_interval=3, max_optimizer_steps=8 → validation fires at steps 3 and 6 (twice),
## then end-of-training split evals run on completion.

data:
  dataset_dir: data/pretokenized_datasets/simplewiki
  train_dir:   data/pretokenized_datasets/simplewiki/splits/train
  val_dirs:
    val_community: data/pretokenized_datasets/simplewiki/splits/val_community
    val_random:    data/pretokenized_datasets/simplewiki/splits/val_random
  test_dirs:
    test_community: data/pretokenized_datasets/simplewiki/splits/test_community
    test_random:    data/pretokenized_datasets/simplewiki/splits/test_random
  strategy: 'bfs'
  layout_policy: 'stochastic_identifier_prefix'
  inference_layout_policy: 'eos'
  order_mode: 'prefer_targets_first'
  doc_budget: null

model:
  compile: false                         # skip ~2-min Triton compile for smoke test
  attention_backend: 'flex'             # flex works without compile on small seqlen
  inference_attention_backend: 'flex'
  mask_type: 'doc_causal'
  model_dim: 128
  num_layers: 2
  num_heads: 4
  max_seq_len: 512
  dropout: 0.0
  drop_path_rate: 0.0
  fp8: false
  weight_tying: true
  ignore_index: -100
  dtype: 'bfloat16'

optimizer:
  type: 'muon'
  wd: 0.1
  momentum: 0.95
  beta1: 0.9
  beta2: 0.95
  muon_lr: 0.02
  adamw_lr: 0.0003

train_loop:
  epochs: 1
  max_optimizer_steps: 8
  val_steps: 3           # batches per val pass — small for speed
  val_interval: 3        # fire at steps 3 and 6 → 2 val passes during training
  atomic_feature_kwargs:
    accum_steps: 1

seed: 42

eval:
  run_on_completion: true
  benchmarks:
    - name: held_out_perplexity
      conditions: [doceval]
  max_docs: 20           # tiny — just enough to confirm the path runs
