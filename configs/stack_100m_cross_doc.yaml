data:
  dataset_dir: /fss/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/thestack
  strategy: 'bfs'
  layout_policy: 'stochastic_identifier_prefix'
  inference_layout_policy: 'identifier_prefix_eos'
  order_mode: 'prefer_targets_first'
  doc_budget: null
  train_dir:   /fss/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/thestack/splits/train
  val_dirs:
    val_community: /fss/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/thestack/splits/val_community
    val_random:    /fss/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/thestack/splits/val_random
  test_dirs:
    test_community: /fss/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/thestack/splits/test_community
    test_random:    /fss/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/thestack/splits/test_random

model:
  compile: true
  compile_mode: 'default'
  attention_backend: 'triton'
  inference_attention_backend: 'flex'
  mask_type: 'cross_doc_link'
  link_detector: 'python'
  max_grants: 256
  # max_grants_start: 64         # cosine warmup start value
  # max_grants_warmup_steps: 5000
  activation_checkpointing: false
  model_dim: 1024
  num_layers: 24
  num_heads: 16
  max_seq_len: 32768
  dropout: 0.1
  drop_path_rate: 0.0
  fp8: false
  weight_tying: true
  ignore_index: -100
  dtype: 'bfloat16'

optimizer:
  type: 'muon'
  wd: 0.1
  momentum: 0.95
  beta1: 0.9
  beta2: 0.95
  muon_lr: 0.003
  adamw_lr: 0.00004

train_loop:
  epochs: 1
  max_optimizer_steps: null  # ~1 pass ≈ 18,400 steps (3.56M nodes / 12 docs/pack / 16 GPUs)
  val_steps: 30
  val_interval: 300
  atomic_feature_kwargs:
    accum_steps: 1

seed: 42

eval:
  run_on_completion: true
  benchmarks:
    - {name: held_out_perplexity,       conditions: [baseline, experimental]}
    - {name: community_pack_perplexity, conditions: [baseline, experimental]}
    - {name: repobench,                 conditions: [doceval]}
    - {name: repobench_cross_doc,       conditions: [experimental]}
    - {name: codexglue_code_to_text,    conditions: [doceval]}
    - {name: humaneval_buggy,           conditions: [doceval]}
  max_docs: 500
  # annotator_corpus not set — no link annotator for code models yet
