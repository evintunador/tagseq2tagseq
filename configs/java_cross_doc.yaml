data:
  dataset_dir: /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/java
  strategy: 'bfs'
  layout_policy: 'stochastic_slash_comment_prefix'
  inference_layout_policy: 'slash_comment_prefix_eos'
  order_mode: 'prefer_targets_first'
  doc_budget: null
  train_dir:   /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/java/splits/train
  # epoch_dirs set after precompute (see design doc §Go pilot); until then the
  # live PackedSequenceDataset runs (single-GPU) — for multi-GPU precompute first.
  epoch_dirs:  /fss-data/evin_t/tagseq2tagseq_artifacts/schedules/java_bfs/epoch_0
  val_dirs:
    val_community: /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/java/splits/val_community
    val_random:    /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/java/splits/val_random
  test_dirs:
    test_community: /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/java/splits/test_community
    test_random:    /fss-data/evin_t/tagseq2tagseq_artifacts/pretokenized_datasets/java/splits/test_random

model:
  compile: true
  compile_mode: 'default'
  attention_backend: 'triton'
  inference_attention_backend: 'flex'
  mask_type: 'cross_doc_link'
  link_detector: 'java'
  max_grants: 256
  activation_checkpointing: false
  model_dim: 1024
  num_layers: 24
  num_heads: 8    # 8H × 128Dh = 1024
  max_seq_len: 32768
  drop_path_rate: 0.0
  fp8: false
  weight_tying: true
  untie_at_frac: 0.667
  ignore_index: -100
  dtype: 'bfloat16'
  logit_softcap: 30.0
  mtp_extra_weights: [0.5, 0.25]
  mtp_decay_steps: 0
  ve_layers: [1, 2, 21, 22, 23]
  shared_ve_bank: false

optimizer:
  type: 'muon'
  muon_wd: 1.2
  adamw_wd: 0.005
  momentum: 0.95
  muon_beta2: 0.95
  beta1: 0.9
  beta2: 0.95
  muon_lr: 0.001
  adamw_lr: 0.00001
  muon_momentum_warmup_steps: 300
  adamw_embed_beta1: 0.5

train_loop:
  epochs: 1
  max_optimizer_steps: null  # set after epoch precomputation
  warmup_steps: 300
  cooldown_frac: 0.4
  min_lr_ratio: 0.1
  val_steps: 30
  val_interval: 300
  save_latest_interval: 300
  atomic_feature_kwargs:
    norm_clip_value: 1.0
    accum_steps: 1

seed: 42

eval:
  run_on_completion: true
  benchmarks:
    - {name: held_out_perplexity,       conditions: [baseline, experimental]}
    - {name: community_pack_perplexity, conditions: [baseline, experimental]}
  max_docs: 500

  # Java link resolution is EXACT-match on the fully-qualified type name (no fuzzy needed,
  # unlike Python/wiki), but the fuzzy cascade is harmless as a fallback.
  link_fuzzy_match: false

