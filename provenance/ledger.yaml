  # === Graph-sparsity scaling law: cross-dataset regression (LITERAL / grounding debt) ===
  # This is a CROSS-RUN analysis fit (Pearson r over many (dataset, keep) points), not a
  # single run's eval metric, so it cannot be eval-grounded. Value is emitted by
  # eval/viz/regress_density.py into sparsity_scaling/regression.json. run_ids list the code
  # solo cross_doc endpoints the fit pools over (ts/thestack/rust/dart/js). Δnll points
  # themselves live in sparsity_scaling/{phase1_eval,phase2_traintime,grid2d}/*.json.
  sparsity.crossdoc_law.eval_r_code:
    run_ids: [run_20260723_044101_595472, run_20260721_225606_146404, run_20260722_172826_905950, run_20260722_172933_276517, run_20260720_063128_690228]
    source: {kind: literal, value: 0.9539707664761473}
    format: {sig_figs: 2}
    note: "Pearson r of cross-doc Δnll@full-density vs effective grants/pack, CODE datasets,
      EVAL-time (n=36). From sparsity_scaling/regression.json (evaltime.code.r), produced by
      eval/viz/regress_density.py. Cross-run analysis fit, not a per-run eval metric → literal
      grounding debt; re-derivable by rerunning regress_density.py on the sparsity_scaling data."
