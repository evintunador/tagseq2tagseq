    run_ids: [run_20260717_173951_071952]
    source: {kind: eval, metric_path: "hotpotqa_cross_doc/experimental", field: average_nll_cross_doc_only}
    expected: 5.628932316290331
    units: nll
    note: "Cross-doc-only mean NLL on the HotpotQA cross-doc benchmark."
  crossdoc.wiki_hotpotqa.nll_flat:
    run_ids: [run_20260717_173951_071952]
    source: {kind: eval, metric_path: "hotpotqa_cross_doc/experimental", field: average_nll_flat_linked_only}
    expected: 6.920065671932407
    units: nll
    note: "Flat-linked-only mean NLL, same run and benchmark."
  crossdoc.wiki_hotpotqa.delta_nll:
    source: {kind: derived, op: subtract, operands: [crossdoc.wiki_hotpotqa.nll_flat, crossdoc.wiki_hotpotqa.nll_crossdoc]}
    units: nll
    note: "flat - cross NLL reduction from cross-document attention."
  crossdoc.wiki_hotpotqa.n:
    run_ids: [run_20260717_173951_071952]
    source: {kind: eval, metric_path: "hotpotqa_cross_doc/experimental", field: n_cross_doc}
    expected: 738
    format: {sig_figs: 0}
    note: "Number of cross-doc examples scored."

