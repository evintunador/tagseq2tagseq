# Results ledger: the single source of truth for every number that enters the paper.
#
# Each entry maps a stable claim-key to a value SOURCE (a specific field of a specific
# run's distilled record), never a hand-typed number. `scripts/gen_values_tex.py`
# resolves every entry against `provenance/runs/<run_id>.json` and emits
# `paper/generated/values.tex`; the paper cites the number as `\val{claim-key}`.
# `scripts/check_grounding.py` re-resolves and fails on any drift.
#
# Claim-key rules: characters [A-Za-z0-9._/-] only. Convention: dot-separated
# <topic>.<subject>.<quantity>, optionally suffixed .ci for a confidence interval.
#
# Value source kinds:
#   eval       {metric_path, field}  -- read record.eval.metrics[metric_path][field].
#                                        For a CI: give an array field (e.g. accuracy_ci)
#                                        OR a "<base>_ci" field; the resolver also accepts
#                                        the sibling-scalar form <base>_ci_low/<base>_ci_high
#                                        and normalizes both to [lo, hi].
#   hyperparam {path}                 -- dotted lookup into record.hyperparameters.
#   derived    {op, operands}         -- op in {subtract, add} over other ledger keys
#                                        (operands are claim-keys). Keeps a delta grounded:
#                                        it is recomputed from its raw components, so it
#                                        cannot drift independently. No interval operands.
#   literal    {value}                -- a number NOT in any distilled artifact (e.g. read
#                                        from a training log). REQUIRES a `note`. Tracked as
#                                        grounding debt; see provenance/README.md.
#
# `expected` (optional) is re-checked against the resolved value within tolerance -- it
# catches a metric that silently changed (e.g. eval_results re-merged after the fact).
# `format`: {sig_figs: N} (default 3), optional {units: "..."} metadata, or
#           {kind: interval} to render a [lo, hi] pair.

schema_version: 1

