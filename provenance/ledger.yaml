  #     identifiers but attention reads a deranged (wrong) donor doc; CI excluding 0 proves
  #     the gain needs the RIGHT document, not just extra in-language context.
  #   leakage_lowalpha.delta_nll = flat-cross Δnll restricted to the lowest target<->aux
  #     8-gram overlap stratum (α<0.05); CI excluding 0 rules out verbatim re-exposure
  #     (RETRO bpb(α) protocol). Sidecar: runs/<id>/eval_leakage_placebo.json.

