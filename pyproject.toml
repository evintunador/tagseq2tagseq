[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagseq2tagseq"
version = "0.1.0"
dependencies = [
    "torch",
    "numpy",
    "tunalab>=0.1.10",
    "tunalab-common>=0.1.5",
    "tunalab-nlp>=0.5.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data", "data.*", "eval", "eval.*", "model", "model.*", "tunalab", "tunalab.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]